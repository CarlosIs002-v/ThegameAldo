name: CyberGrid CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Garantía de Calidad y Tests Automatizados
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Suite de Tests Unitarios y de Integración (Vitest)
        run: npm run test:unit

      - name: Instalar navegadores para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Flujos End-to-End (Playwright)
        run: npm run test:e2e
        env:
          CI: true

      - name: Subir artefactos de prueba si hay fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
